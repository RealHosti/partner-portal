name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_PORTAL_CHAT_ROOM_ID: partner-lounge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production config
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "::error::NEXT_PUBLIC_SUPABASE_URL is missing" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is missing" && exit 1)
          echo "Supabase public config is present."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static app
        run: pnpm build

      - name: Verify Pages artifact
        run: |
          test -f out/index.html || (echo "::error::out/index.html is missing" && exit 1)
          test -f out/404.html || (echo "::error::out/404.html is missing" && exit 1)
          test -f out/CNAME || (echo "::error::out/CNAME is missing" && exit 1)
          grep -qx "partners.realhosti.de" out/CNAME || (echo "::error::out/CNAME has wrong domain" && exit 1)
          echo "Pages artifact contains index.html, 404.html and CNAME."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
